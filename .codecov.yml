# SPEC CV6: the project status fails on any drop against the base commit (a
# ratchet, like each suite's own floor, CV2-CV5, until coverage reaches 100%);
# the patch status needs every changed line covered.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

# SPEC CV6: a suite a pull request's path filters skip keeps its last upload
# (carryforward), so the project status still compares every suite.
flag_management:
  default_rules:
    carryforward: true
