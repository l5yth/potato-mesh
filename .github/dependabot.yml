version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/data"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Room for one open pull request per action in use, so no update waits
    # behind the others (the default limit is 5).
    open-pull-requests-limit: 20
  - package-ecosystem: "cargo"
    directory: "/matrix"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
