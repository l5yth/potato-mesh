name: Build and Push Docker Images

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    # A dispatch publishes the version tags only; promote-latest moves the
    # default tag after a stable tag push passes test-images (SPEC LT).
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: l5yth/potato-mesh

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      packages: write

    strategy:
      # One architecture's breakage must never withhold the other
      # architectures' images: publish legs are independent (DK-A1).
      fail-fast: false
      matrix:
        service: [web, ingestor, matrix-bridge]
        architecture:
          - { name: linux-amd64, platform: linux/amd64, label: "Linux x86_64", os: linux, architecture: amd64 }
          - { name: linux-arm64, platform: linux/arm64, label: "Linux ARM64", os: linux, architecture: arm64 }
          - { name: linux-armv7, platform: linux/arm/v7, label: "Linux ARMv7", os: linux, architecture: arm }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Full history + tags so `git describe` can compute the baked app
        # version below (the published image ships without .git).
        fetch-depth: 0

    - name: Set up QEMU emulation
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version from tag or input
      id: version
      env:
        # Read through env rather than an expression in the script: the
        # dispatch input is free text.
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ github.event.inputs.version }}
        # Character ranges in the check below match ASCII only in this locale.
        LC_ALL: C
      # The check below needs bash's [[ =~ ]].
      shell: bash
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          RAW_VERSION="$INPUT_VERSION"
        else
          RAW_VERSION=${GITHUB_REF#refs/tags/}
        fi

        STRIPPED_VERSION=${RAW_VERSION#v}

        # Only a release version becomes a tag, so no tag push or dispatch
        # input can name the default tag; promote-latest alone moves it
        # (SPEC LT, tests/test_docker_latest_gate.py).
        RELEASE_VERSION='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        if [[ ! "$STRIPPED_VERSION" =~ $RELEASE_VERSION ]]; then
          # %q prints the input on one line, so it cannot start a workflow command.
          echo "::error::Not a release version (X.Y.Z or X.Y.Z-suffix): $(printf '%q' "$RAW_VERSION")"
          exit 1
        fi

        echo "version=$STRIPPED_VERSION" >> $GITHUB_OUTPUT
        echo "version_with_v=v$STRIPPED_VERSION" >> $GITHUB_OUTPUT
        echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT
        echo "Published version: $STRIPPED_VERSION"

    - name: Compute baked application version
      id: appversion
      run: |
        # The published image ships without `.git` (`.dockerignore` excludes it),
        # so bake the version in as a build arg. `determine_app_version` prefers
        # it, keeping the in-image `?v=` asset buster unique per build so
        # `AssetCacheControl` serves versioned JS/CSS `immutable` (SPEC AV1). Fall
        # back to the release tag when git metadata is somehow unavailable.
        APP_VERSION=$(git describe --tags --long --abbrev=7 2>/dev/null || true)
        if [ -z "$APP_VERSION" ]; then
          APP_VERSION="${{ steps.version.outputs.version_with_v }}"
        fi
        echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        echo "Baked APP_VERSION: $APP_VERSION"

    - name: Build and push ${{ matrix.service }} for ${{ matrix.architecture.name }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.service == 'web' && './web/Dockerfile' || matrix.service == 'ingestor' && './data/Dockerfile' || './matrix/Dockerfile' }}
        target: ${{ matrix.service == 'matrix-bridge' && 'runtime' || 'production' }}
        platforms: ${{ matrix.architecture.platform }}
        push: true
        # Only the web image consumes APP_VERSION (its Dockerfile declares the
        # ARG); other services ignore it. Empty for them so Buildx has no
        # unconsumed build-arg to warn about.
        build-args: |
          ${{ matrix.service == 'web' && format('APP_VERSION={0}', steps.appversion.outputs.app_version) || '' }}
        # Version tags only: promote-latest moves the default tag once
        # test-images has passed (SPEC LT).
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-${{ matrix.architecture.name }}:${{ steps.version.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-${{ matrix.architecture.name }}:${{ steps.version.outputs.version_with_v }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.description=PotatoMesh ${{ matrix.service == 'web' && 'Web Application' || matrix.service == 'ingestor' && 'Python Ingestor' || 'Matrix Bridge' }} for ${{ matrix.architecture.label }}
          org.opencontainers.image.licenses=Apache-2.0
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.title=PotatoMesh ${{ matrix.service == 'web' && 'Web' || matrix.service == 'ingestor' && 'Ingestor' || 'Matrix Bridge' }} (${{ matrix.architecture.label }})
          org.opencontainers.image.vendor=PotatoMesh
          org.opencontainers.image.architecture=${{ matrix.architecture.architecture }}
          org.opencontainers.image.os=${{ matrix.architecture.os }}
        cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.architecture.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.architecture.name }}

  test-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version from tag
      id: version
      run: |
        RAW_VERSION=${GITHUB_REF#refs/tags/}
        STRIPPED_VERSION=${RAW_VERSION#v}
        echo "version=$STRIPPED_VERSION" >> $GITHUB_OUTPUT
        echo "version_with_v=v$STRIPPED_VERSION" >> $GITHUB_OUTPUT

    - name: Test web application (Linux AMD64)
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-linux-amd64:${{ steps.version.outputs.version }}
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-linux-amd64:${{ steps.version.outputs.version_with_v }}
        docker run --rm -d --name web-test -p 41447:41447 \
          -e API_TOKEN=test-token \
          -e DEBUG=1 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-linux-amd64:${{ steps.version.outputs.version }}
        sleep 10
        curl -f http://localhost:41447/ || exit 1
        docker stop web-test

    - name: Test ingestor (Linux AMD64)
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ingestor-linux-amd64:${{ steps.version.outputs.version }}
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ingestor-linux-amd64:${{ steps.version.outputs.version_with_v }}
        docker run --rm --name ingestor-test \
          -e INSTANCE_DOMAIN=http://localhost:41447 \
          -e API_TOKEN=test-token \
          -e CONNECTION=mock \
          -e DEBUG=1 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ingestor-linux-amd64:${{ steps.version.outputs.version }} &
        sleep 5
        docker stop ingestor-test || true

  promote-latest:
    runs-on: ubuntu-latest
    # The implicit success() runs this job only after every build leg and
    # test-images passed, so a failed build or smoke test moves no default tag;
    # a retag that fails partway leaves the images before it moved (SPEC LT3).
    # A status function here (always(), failure(), cancelled()) would let an
    # image that failed the smoke test become the default tag
    # (tests/test_docker_latest_gate.py).
    needs: [build-and-push, test-images]
    # Stable tag pushes only: a pre-release tag or a dispatch moves nothing.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
      && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta')
      && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-dev')
    environment: production
    permissions:
      packages: write

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Point latest at the tested release
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        # The images build-and-push publishes, one per service and
        # architecture of its matrix. tests/test_docker_latest_gate.py checks
        # that these two loop lines, and no others, list the matrix's services
        # and architectures, and refuses a matrix written in another form (an
        # include or exclude among them); it does not read the loop body.
        IMAGES=""
        for service in web ingestor matrix-bridge; do
          for arch in linux-amd64 linux-arm64 linux-armv7; do
            IMAGES="$IMAGES $REGISTRY/$IMAGE_PREFIX-$service-$arch"
          done
        done
        # Resolve every source first, so a missing image moves no tag.
        for image in $IMAGES; do
          docker buildx imagetools inspect "$image:$VERSION" > /dev/null
        done
        # Copy each version's manifest to the default tag; nothing is rebuilt.
        for image in $IMAGES; do
          echo "Promoting $image:$VERSION to latest"
          docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          docker buildx imagetools inspect "$image:latest"
        done

  publish-summary:
    runs-on: ubuntu-latest
    needs: [build-and-push, test-images, promote-latest]
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'

    steps:
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish release summary
      env:
        # The default tags are listed only when promote-latest moved them.
        PROMOTED: ${{ needs.promote-latest.result == 'success' }}
      run: |
        echo "## 🚀 PotatoMesh Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Published Images:**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Web images
        echo "### 🌐 Web Application" >> $GITHUB_STEP_SUMMARY
        if [ "$PROMOTED" = "true" ]; then
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-linux-amd64:latest\` - Linux x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-linux-arm64:latest\` - Linux ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-linux-armv7:latest\` - Linux ARMv7" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Ingestor images
        echo "### 📡 Ingestor Service" >> $GITHUB_STEP_SUMMARY
        if [ "$PROMOTED" = "true" ]; then
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ingestor-linux-amd64:latest\` - Linux x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ingestor-linux-arm64:latest\` - Linux ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ingestor-linux-armv7:latest\` - Linux ARMv7" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Matrix bridge images
        echo "### 🧩 Matrix Bridge" >> $GITHUB_STEP_SUMMARY
        if [ "$PROMOTED" = "true" ]; then
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-matrix-bridge-linux-amd64:latest\` - Linux x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-matrix-bridge-linux-arm64:latest\` - Linux ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-matrix-bridge-linux-armv7:latest\` - Linux ARMv7" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
