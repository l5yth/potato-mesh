name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/**'
      - 'matrix/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./matrix/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Show rustc version
        run: rustc --version
      - name: Install llvm-tools-preview component
        run: rustup component add llvm-tools-preview --toolchain stable
      - name: Install cargo-llvm-cov
        working-directory: ./matrix
        run: cargo install cargo-llvm-cov --locked
      - name: Check formatting
        working-directory: ./matrix
        run: cargo fmt --all -- --check
      - name: Clippy lint
        working-directory: ./matrix
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        working-directory: ./matrix
        run: cargo build --all --all-features
      - name: Test
        working-directory: ./matrix
        run: cargo test --all --all-features --verbose
      - name: Run tests with coverage
        working-directory: ./matrix
        # SPEC CV5: fails below the line coverage floor of the bridge's
        # sources; the unit tests (src/tests.rs, src/*/tests.rs) and tests/
        # are not source. The stable toolchain measures no branches (cargo
        # llvm-cov --branch needs nightly).
        run: |
          cargo llvm-cov --all-features --workspace --ignore-filename-regex '(^|/)tests(/|\.rs$)' --lcov --output-path coverage.lcov --fail-under-lines 85.61
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./matrix/coverage.lcov
          disable_search: true
          flags: matrix-bridge
          name: matrix-bridge
          fail_ci_if_error: false
